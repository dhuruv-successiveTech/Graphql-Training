type User {
  id: ID!
  name: String!
  email: String!
  password:String
  posts: [Post!]!
  comments: [Comment!]!
}

type Post {
  id: ID!
  title: String!
  content: String!
  date: String!
  author: User!
  comments: [Comment!]!
}

type Comment {
  id: ID!
  text: String!
  author: User!
  post: Post!
}

type AuthPayload {
  user: User!
  token:String
}

type Error {
  message: String!
  code: Int
}

union PostResult = Post | Error
union UserResult = User | Error
union CommentResult = Comment | Error
union AuthPayloadResult = AuthPayload | Error
